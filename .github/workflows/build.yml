name: Build

on:
  push:
    branches-ignore:
      - renovate/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The core is built for Java 17, the Paper plugin needs Java 25. Make both
  # available to the Gradle toolchains.
  GRADLE_TOOLCHAIN_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the unit and command tests
        run: ./gradlew :core:test $GRADLE_TOOLCHAIN_ARGS --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/test
          retention-days: 7

  build:
    name: Build the Paper plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      # The compiler flags fail the build on deprecated API
      - name: Build the plugin jar
        run: ./gradlew :paper:jar $GRADLE_TOOLCHAIN_ARGS --stacktrace
      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: portals-pro-max-paper
          path: paper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  paper-smoke-test:
    name: Paper 26.3 server start
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: portals-pro-max-paper
          path: plugin
      - name: Start Paper with the plugin and run a few commands
        run: .github/scripts/paper-smoke-test.sh "$(ls plugin/*.jar | head -n 1)" 26.3
